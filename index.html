<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Bible</title>

    <!-- 桌面图标 -->
    <link rel="icon" href="https://c7-pic.oss-cn-beijing.aliyuncs.com/alpha_omega_2.png">
    <link rel="apple-touch-icon" href="https://c7-pic.oss-cn-beijing.aliyuncs.com/alpha_omega_2.png">

    <!-- iOS 全屏 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- ✅ 样式（去 Flask） -->
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>

<div class="box">
    <!-- 书卷下拉 -->
    <div class="select-row">
        <div class="select-group">
            <select id="book" onchange="onBookChange(this)">
                <!-- ✅ JS 会动态填充 -->
            </select>
        </div>

        <!-- 章节下拉 -->
        <div class="select-group">
            <select id="chapter" onchange="onChapterChange(this)">
                <!-- ✅ JS 会动态填充 -->
            </select>
        </div>
    </div>
</div>

<div id="verses" class="verses-container"></div>

<div class="player">
    <button id="prev-chapter" onclick="prevChapter()" aria-label="上一章">
        <svg class="ctrl-icon" viewBox="0 0 24 24">
            <path d="M15 18l-6-6 6-6"/>
        </svg>
    </button>

    <button id="play-pause-btn" onclick="togglePlay()" aria-label="播放 / 暂停">
        <svg id="icon-play" class="ctrl-icon" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="icon-pause" class="ctrl-icon" viewBox="0 0 24 24">
            <path d="M6 4h4v16H6zm8 0h4v16h-4z"/>
        </svg>
    </button>

    <button id="next-chapter" onclick="nextChapter()" aria-label="下一章">
        <svg class="ctrl-icon" viewBox="0 0 24 24">
            <path d="M9 6l6 6-6 6"/>
        </svg>
    </button>

    <input id="progress" type="range" min="0" max="100" value="0" step="0.1">
</div>

<audio id="audio-player" preload="none"></audio>

<!-- ✅ JS（去 Flask） -->
<script src="./static/js/highlight.js"></script>
<script src="./static/js/player.js"></script>

<script src="./static/js/book.js"></script>
<script src="./static/js/chapter.js"></script>
<script src="./static/js/verse.js"></script>

<script src="./static/js/entity.js"></script>
<script src="./static/js/main.js"></script>

</body>
</html>
